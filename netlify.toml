[build]
  command = "npm install && cd backend && npm install && cd ../frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"
  included_files = ["backend/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
